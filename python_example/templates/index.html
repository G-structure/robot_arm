<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Arm Camera Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .camera-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .camera-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .camera-container {
            position: relative;
            background: black;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        
        .camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .camera-overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .control-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .control-section {
            margin-bottom: 25px;
        }
        
        .control-section h3 {
            margin-bottom: 15px;
            color: #ffd700;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }
        
        .input-group textarea {
            min-height: 80px;
            resize: vertical;
            font-family: 'Courier New', monospace;
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .btn.btn-secondary {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
        }
        
        .btn.btn-secondary:hover {
            box-shadow: 0 5px 15px rgba(116, 185, 255, 0.4);
        }
        
        .status-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .status-item {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }
        
        .status-label {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            word-wrap: break-word;
        }
        
        .quick-commands {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .alert.success {
            background: rgba(46, 204, 113, 0.8);
        }
        
        .alert.error {
            background: rgba(231, 76, 60, 0.8);
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .control-panel {
                order: -1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Robot Arm Camera Control</h1>
            <p>Live camera feed and control interface</p>
        </div>
        
        <div class="main-content">
            <div class="camera-section">
                <h2 class="camera-title">📹 Live Camera Feed</h2>
                <div class="camera-container">
                    <img src="/video_feed" class="camera-feed" alt="Robot Arm Camera Feed">
                    <div class="camera-overlay">
                        <div id="camera-status">● LIVE</div>
                    </div>
                </div>
            </div>
            
            <div class="control-panel">
                <div class="control-section">
                    <h3>🔧 Robot Configuration</h3>
                    <div class="input-group">
                        <label for="robot-ip">Robot IP Address:</label>
                        <input type="text" id="robot-ip" placeholder="e.g., 192.168.1.100">
                    </div>
                    <button class="btn btn-secondary" onclick="configureRobot()">Connect to Robot</button>
                </div>
                
                <div class="control-section">
                    <h3>🎮 Quick Commands</h3>
                    <div class="quick-commands">
                        <button class="btn" onclick="sendQuickCommand('{\"T\":104}')">Home Position</button>
                        <button class="btn" onclick="sendQuickCommand('{\"T\":1}')">Get Status</button>
                        <button class="btn" onclick="sendQuickCommand('{\"T\":2}')">Stop</button>
                        <button class="btn" onclick="sendQuickCommand('{\"T\":3}')">Reset</button>
                    </div>
                </div>
                
                <div class="control-section">
                    <h3>📝 Custom Command</h3>
                    <div class="input-group">
                        <label for="json-command">JSON Command:</label>
                        <textarea id="json-command" placeholder='{"T": 104, "x": 100, "y": 200, "z": 150}'></textarea>
                    </div>
                    <button class="btn" onclick="sendCustomCommand()">Send Command</button>
                </div>
                
                <div id="alert-container"></div>
            </div>
        </div>
        
        <div class="status-section">
            <h3>📊 System Status</h3>
            <div class="status-item">
                <div class="status-label">Camera Status:</div>
                <div class="status-value" id="camera-status-detail">Checking...</div>
            </div>
            <div class="status-item">
                <div class="status-label">Robot Connection:</div>
                <div class="status-value" id="robot-connection">Not configured</div>
            </div>
            <div class="status-item">
                <div class="status-label">Last Command:</div>
                <div class="status-value" id="last-command">None</div>
            </div>
            <div class="status-item">
                <div class="status-label">Last Response:</div>
                <div class="status-value" id="last-response">None</div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let robotIP = '';
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            updateCameraStatus();
            updateRobotStatus();
            setInterval(updateRobotStatus, 5000); // Update status every 5 seconds
        });
        
        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alert-container');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${type}`;
            alertDiv.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }
        
        async function updateCameraStatus() {
            try {
                const response = await fetch('/camera/info');
                const data = await response.json();
                document.getElementById('camera-status-detail').textContent = 
                    `${data.status} - ${data.resolution} @ ${data.fps}fps`;
            } catch (error) {
                document.getElementById('camera-status-detail').textContent = 'Error getting camera info';
            }
        }
        
        async function updateRobotStatus() {
            try {
                const response = await fetch('/robot/status');
                const data = await response.json();
                
                document.getElementById('robot-connection').textContent = 
                    data.robot_ip ? `Connected to ${data.robot_ip}` : 'Not configured';
                document.getElementById('last-command').textContent = 
                    data.last_command || 'None';
                document.getElementById('last-response').textContent = 
                    data.last_response || 'None';
            } catch (error) {
                document.getElementById('robot-connection').textContent = 'Error getting robot status';
            }
        }
        
        async function configureRobot() {
            const ip = document.getElementById('robot-ip').value.trim();
            if (!ip) {
                showAlert('Please enter a robot IP address', 'error');
                return;
            }
            
            try {
                const response = await fetch('/robot/config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ip: ip })
                });
                
                const data = await response.json();
                if (data.success) {
                    robotIP = ip;
                    showAlert(`Connected to robot at ${ip}`, 'success');
                    updateRobotStatus();
                } else {
                    showAlert('Failed to configure robot', 'error');
                }
            } catch (error) {
                showAlert('Error configuring robot: ' + error.message, 'error');
            }
        }
        
        async function sendCommand(command) {
            if (!robotIP) {
                showAlert('Please configure robot IP first', 'error');
                return;
            }
            
            try {
                const response = await fetch('/robot/command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command: command })
                });
                
                const data = await response.json();
                if (data.success) {
                    showAlert('Command sent successfully', 'success');
                } else {
                    showAlert('Command failed: ' + (data.error || 'Unknown error'), 'error');
                }
                
                updateRobotStatus();
            } catch (error) {
                showAlert('Error sending command: ' + error.message, 'error');
            }
        }
        
        function sendQuickCommand(command) {
            sendCommand(command);
        }
        
        function sendCustomCommand() {
            const command = document.getElementById('json-command').value.trim();
            if (!command) {
                showAlert('Please enter a JSON command', 'error');
                return;
            }
            
            try {
                JSON.parse(command); // Validate JSON
                sendCommand(command);
            } catch (error) {
                showAlert('Invalid JSON format', 'error');
            }
        }
    </script>
</body>
</html>
