[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-arm-web-ui"
version = "0.1.0"
description = "A web interface for controlling a robot arm and viewing its camera feed."
authors = [{ name = "AI Assistant" }]
requires-python = ">=3.9"
dependencies = [
    "certifi==2023.7.22",
    "charset-normalizer==3.2.0",
    "idna==3.4",
    "requests==2.31.0",
    "urllib3==2.0.4",
    "flask==3.0.0",
    "flask-sock==0.7.0",
    "opencv-python==4.11.0.86",
    "numpy==2.0.2",
]

[tool.setuptools.packages.find]
include = ["web_ui"]

[project.scripts]
start-robot-ui = "web_ui.server:main" 